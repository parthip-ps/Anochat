<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnonChat — talk to anyone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0D1117;
      --surface:   #161B22;
      --border:    #21262D;
      --text:      #E8EDF2;
      --muted:     #8B949E;
      --me-bg:     #003D52;
      --me-accent: #00C8FF;
      --them-bg:   #1E2530;
      --sys:       #FFB347;
      --input-bg:  #0D1117;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--me-accent);
    }

    .logo span { color: var(--text); }

    .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .online-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 200, 255, 0.08);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 20px;
      padding: 3px 10px 3px 8px;
      color: var(--me-accent);
      font-size: 12px;
      font-weight: 500;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--me-accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    .my-name {
      font-size: 12px;
      color: var(--muted);
    }

    .my-name strong {
      color: var(--me-accent);
      font-weight: 500;
    }

    /* ── Message Feed ── */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    #feed::-webkit-scrollbar { width: 4px; }
    #feed::-webkit-scrollbar-track { background: transparent; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Messages ── */
    .msg-wrap {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      animation: fadeUp 0.18s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-wrap.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrap.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-name {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 4px;
      font-weight: 500;
    }

    .msg-wrap.mine .msg-name { color: var(--me-accent); }

    .bubble {
      padding: 9px 14px;
      border-radius: 14px;
      word-break: break-word;
      font-size: 14.5px;
      line-height: 1.55;
      position: relative;
    }

    .msg-wrap.mine .bubble {
      background: var(--me-bg);
      color: var(--text);
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(0, 200, 255, 0.15);
    }

    .msg-wrap.theirs .bubble {
      background: var(--them-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .msg-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 4px;
      opacity: 0.7;
    }

    /* ── System messages ── */
    .sys-msg {
      text-align: center;
      font-size: 12px;
      color: var(--sys);
      opacity: 0.65;
      padding: 6px 0;
      font-style: italic;
      animation: fadeUp 0.18s ease both;
    }

    /* ── Date separator ── */
    .date-sep {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.5;
      padding: 12px 0 6px;
      letter-spacing: 0.03em;
    }

    /* ── Input Bar ── */
    #input-bar {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.5;
      scrollbar-width: none;
    }

    #msg-input::-webkit-scrollbar { display: none; }

    #msg-input:focus {
      border-color: rgba(0, 200, 255, 0.4);
    }

    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--me-accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      color: #000;
    }

    #send-btn:hover  { background: #33d4ff; }
    #send-btn:active { transform: scale(0.93); }

    #send-btn svg { width: 18px; height: 18px; }

    /* ── Connecting overlay ── */
    #connecting {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.3s;
    }

    #connecting.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--me-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .conn-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--muted);
    }

    /* ── Empty state ── */
    #empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      pointer-events: none;
    }

    #empty p {
      color: var(--muted);
      font-size: 14px;
      max-width: 240px;
      line-height: 1.6;
    }

    #empty.gone { display: none; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #app { border: none; }
      .msg-wrap { max-width: 85%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot, .spinner { animation: none; }
      .msg-wrap, .sys-msg { animation: none; }
    }
  </style>
</head>
<body>

<!-- Connecting overlay -->
<div id="connecting">
  <div class="spinner"></div>
  <p class="conn-text">Connecting to chat…</p>
</div>

<div id="app">
  <header>
    <div class="logo">Anon<span>Chat</span></div>
    <div class="meta">
      <div class="my-name">You are <strong id="my-name-label">—</strong></div>
      <div class="online-pill">
        <span class="dot"></span>
        <span id="online-count">0</span> online
      </div>
    </div>
  </header>

  <div id="feed">
    <div id="empty">
      <p>No messages yet. Say hi to whoever is here — nobody knows who you are.</p>
    </div>
  </div>

  <div id="input-bar">
    <textarea
      id="msg-input"
      placeholder="Type a message… (Enter to send)"
      rows="1"
      maxlength="500"
      autocomplete="off"
      spellcheck="true"
    ></textarea>
    <button id="send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<!-- Socket.IO client — points to your Render backend -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // ─────────────────────────────────────────────────────────────
  // CONFIG: replace with your Render backend URL after deploying
  // ─────────────────────────────────────────────────────────────
  const SERVER_URL = 'REPLACE_WITH_RENDER_URL';
  // ─────────────────────────────────────────────────────────────

  const feed         = document.getElementById('feed');
  const input        = document.getElementById('msg-input');
  const sendBtn      = document.getElementById('send-btn');
  const onlineEl     = document.getElementById('online-count');
  const nameLabel    = document.getElementById('my-name-label');
  const connecting   = document.getElementById('connecting');
  const empty        = document.getElementById('empty');

  let myName = null;

  const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    connecting.classList.add('hidden');
  });

  socket.on('connect_error', () => {
    connecting.querySelector('.conn-text').textContent = 'Connection failed — retrying…';
  });

  socket.on('assigned_name', (name) => {
    myName = name;
    nameLabel.textContent = name;
  });

  socket.on('online_count', (n) => {
    onlineEl.textContent = n;
  });

  socket.on('new_message', ({ name, text, ts }) => {
    hideEmpty();
    const isMine = name === myName;
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${isMine ? 'mine' : 'theirs'}`;

    const nameEl = document.createElement('div');
    nameEl.className = 'msg-name';
    nameEl.textContent = isMine ? 'You' : name;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime(ts);

    wrap.appendChild(nameEl);
    wrap.appendChild(bubble);
    wrap.appendChild(timeEl);
    feed.appendChild(wrap);
    scrollBottom();
  });

  socket.on('system_message', (msg) => {
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = msg;
    feed.appendChild(el);
    scrollBottom();
  });

  // ── Send ──
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    socket.emit('send_message', text);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── Helpers ──
  function scrollBottom() {
    requestAnimationFrame(() => {
      feed.scrollTop = feed.scrollHeight;
    });
  }

  function hideEmpty() {
    empty.classList.add('gone');
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
</script>
</body>
</html>
